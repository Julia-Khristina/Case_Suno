  trecho_original: 'JUROS DE MORA. JUROS MORATÓRIOS É um encargo que a instituição financeira cobra do devedor quando o pagamento
    de uma dívida é feito com atraso, para compensar o fato de só ter recebido o valor devido depois da data combinada. Os
    juros de mora também servem como uma punição para as pessoas não deixarem de pagar as contas em dia. Diferentemente da
    multa, que tem um valor fixo, a mora fica maior quanto mais dias o pagamento ficar em atraso. Exemplo de uso: esqueci
    que o boleto vencia ontem e agora vou ter que pagar mora. Ver também: boleto, cedente, juros, multa, sacado.'
