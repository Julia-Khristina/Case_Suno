  trecho_original: 'É o valor máximo que pode ser descontado de salário, pensão, aposentadoria, ou outra renda, para o pagamento
    de prestações de empréstimos consignados. Em geral, a margem consignável corresponde a 30% (trinta por cento) da renda
    líquida, mas há categorias profissionais (como os militares) que permitem margem consignável de até 70% da renda. Esse
    limite tem o objetivo de impedir que as pessoas peguem empréstimos maiores que sua capacidade de pagamento. Exemplo de
    uso: a margem consignável de um salário de R$3.000 é de R$900. Ver também: crédito consignado, dívida, renda bruta, renda
