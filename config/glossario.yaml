- termo: Alienação fiduciária
  variacoes: []
  nivel: iniciante
  explicacao_iniciante: É um tipo de garantia muito comum em financiamentos de bens, como de carro ou casa. Na alienação fiduciária,
    o bem que é dado em garantia fica no nome da instituição financeira enquanto a dívida não for totalmente paga.
  explicacao_impacto: null
  pronuncia: null
  fonte_definicao: Glossário de Cidadania Financeira (BCB)
  url_fonte: https://www.bcb.gov.br/content/cidadaniafinanceira/documentos_cidadania/Informacoes_gerais/glossario_cidadania_financeira.pdf
  data_consulta: '2026-10-17'
  trecho_original: 'É um tipo de garantia muito comum em financiamentos de bens, como de carro ou casa. Na alienação fiduciária,
    o bem que é dado em garantia fica no nome da instituição financeira enquanto a dívida não for totalmente paga. Apesar
    de estar no nome da instituição financeira, o devedor fica com o bem e pode usá-lo normalmente enquanto paga o contrato.
    Quando termina de pagar, o bem passa automaticamente para o nome do devedor novamente. Mas se parar de pagar, a instituição
    financeira pode vender o bem para quitar a dívida. Exemplo: financiei meu carro pelo banco, e ele está alienado em nome
    do banco'
  status: pendente
- termo: Alíquota
  variacoes: []
  nivel: iniciante
  explicacao_iniciante: A alíquota é o percentual que deverá ser aplicado sobre uma base de cálculo para calcular o valor
    do imposto. A base de cálculo é o valor do bem sobre o qual se paga o imposto, podendo ser a renda, um imóvel, um automóvel,
    produtos ou serviços.
  explicacao_impacto: null
  pronuncia: null
  fonte_definicao: Glossário de Cidadania Financeira (BCB)
  url_fonte: https://www.bcb.gov.br/content/cidadaniafinanceira/documentos_cidadania/Informacoes_gerais/glossario_cidadania_financeira.pdf
  data_consulta: '2026-10-17'
  trecho_original: 'A alíquota é o percentual que deverá ser aplicado sobre uma base de cálculo para calcular o valor do imposto.
    A base de cálculo é o valor do bem sobre o qual se paga o imposto, podendo ser a renda, um imóvel, um automóvel, produtos
    ou serviços. Exemplo de uso: se a alíquota do imposto sobre um veículo em um determinado estado for de 4% e o valor de
    referência do carro (a base de cálculo) for de R$100 mil, o valor do imposto será de R$4 mil. Ver também: IOF. 12 GLOSSÁRIO
    SIMPLIFICADO DE TERMOS FINANCEIROS'
  status: pendente
- termo: Amortização
  variacoes: []
  nivel: intermediario
  explicacao_iniciante: 'Uma dívida normalmente é composta de duas partes: o principal e os juros. Tecnicamente, amortização
    é o pagamento do principal, o que efetivamente reduz a dívida.'
  explicacao_impacto: null
  pronuncia: null
  fonte_definicao: Glossário de Cidadania Financeira (BCB)
  url_fonte: https://www.bcb.gov.br/content/cidadaniafinanceira/documentos_cidadania/Informacoes_gerais/glossario_cidadania_financeira.pdf
  data_consulta: '2026-10-17'
  trecho_original: 'Uma dívida normalmente é composta de duas partes: o principal e os juros. Tecnicamente, amortização é
    o pagamento do principal, o que efetivamente reduz a dívida. No valor total de uma prestação, por exemplo, parte é destinada
    para amortizar (reduzir) a dívida, enquanto outra vai para o pagamento de juros e outros encargos (despesas financeiras).
    Popularmente, amortizar significa reduzir uma dívida, pagando as prestações aos poucos. Exemplo de uso: ao pagar um empréstimo
    de R$1.000 (o principal) em 10 parcelas de R$120, em cada parcela, R$100 são para a amortização, e os R$20 restantes vão
    par'
  status: pendente
