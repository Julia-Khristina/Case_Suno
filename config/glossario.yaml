  trecho_original: 'É quem empresta ou transfere a posse do bem em um contrato de mútuo. Exemplo de uso: o financiamento imobiliário
    de um banco (ou caixa econômica) a uma pessoa é um contrato de mútuo, pois consiste em um empréstimo de dinheiro concedido
    por um mutuante (a instituição financeira) a um mutuário (o comprador) para a aquisição de um imóvel. Nesse caso, geralmente
    o próprio imóvel serve como garantia do empréstimo e o mutuário fica obrigado a devolver ao mutuante o valor que tomou
    emprestado, acrescido de juros. Ver também: contrato de mútuo, fungível, mutuário.'
