  trecho_original: Leasing (em português, arrendamento mercantil) é uma espécie de aluguel que permite a compra de um bem
    a prazo. Diferentemente de um financiamento comum, no leasing o cliente fica com a posse do bem arrendado, mas quem tem
    a propriedade real desse bem é a instituição financeira que viabilizou o arrendamento. Isto é, o cliente não se torna
    o dono efetivo do bem enquanto não pagar por ele totalmente. Ao final do contrato de arrendamento, o cliente pode adquirir
    a propriedade do bem arrendado, pode renovar o contrato ou pode devolver o bem à instituição que o arrendou, dependendo
