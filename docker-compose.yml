services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suno}
      POSTGRES_DB: ${POSTGRES_DB:-suno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suno} -d ${POSTGRES_DB:-suno}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-suno}:${POSTGRES_PASSWORD:-suno}@postgres:5432/${POSTGRES_DB:-suno}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
      - app_cache:/app/.cache/suno

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-suno}:${POSTGRES_PASSWORD:-suno}@postgres:5432/${POSTGRES_DB:-suno}
    command: ["python", "-m", "src.collection.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app

  renderer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["python", "-c", "print('Renderer placeholder')"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  app_cache: