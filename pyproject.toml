[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "case-suno-content"
version = "0.1.0"
description = "Adaptacao de documentos financeiros para 3 niveis x 3 formatos com avaliador hibrido."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "streamlit>=1.57",
  "langgraph>=1.2",
  "langgraph-checkpoint-postgres>=3.0",
  "psycopg[binary]>=3.2",
  "playwright>=1.49",
  "pymupdf>=1.25",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
# tests/audit contém scripts de diagnóstico (rodar com python -m tests.audit.<script>), não testes
testpaths = ["tests/unit", "tests/offline", "tests/regression", "tests/integration", "tests/e2e"]
addopts = "-q"
markers = ["offline: offline evaluation and acceptance tests"]
