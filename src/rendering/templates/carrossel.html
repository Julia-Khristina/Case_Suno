<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
$font_faces
:root {
  --red: $vermelho; --red-dark: $vermelho_escuro; --white: $branco; --ink: $tinta; --ink-soft: $tinta_suave;
  --red-soft: $vermelho_suave; --m: ${margem}px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: ${largura}px; height: ${altura}px; }
body { font-family: '$familia', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.slide { position: relative; width: ${largura}px; height: ${altura}px; overflow: hidden;
  display: flex; flex-direction: column; padding: calc(var(--m) + 24px) var(--m) var(--m); }
.slide.vermelho { background: var(--red); color: var(--white); }
.slide.branco { background: var(--white); color: var(--ink); }

/* Linha do nível: Iniciante em cima, Intermediário nas laterais, Avançado embaixo; branca sobre vermelho */
.linha { position: absolute; background: var(--red); border-radius: 3px; }
.vermelho .linha { background: var(--white); }
.linha.em-cima { top: 44px; left: var(--m); right: var(--m); height: 7px; }
.linha.embaixo { bottom: 44px; left: var(--m); right: var(--m); height: 7px; }
.linha.lateral-esq { left: 44px; top: var(--m); bottom: var(--m); width: 7px; }
.linha.lateral-dir { right: 44px; top: var(--m); bottom: var(--m); width: 7px; }

.topo { display: flex; justify-content: space-between; align-items: center; height: 56px; }
.topo img { height: 46px; }
.pagina { font-size: 26px; font-weight: 600; letter-spacing: .08em; opacity: .85; }
.rotulo { display: inline-block; font-size: 24px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  padding: 10px 20px; border-radius: 999px; margin-top: 44px; align-self: flex-start; }
.branco .rotulo { background: var(--red-soft); color: var(--red); }
.vermelho .rotulo { background: rgba(255,255,255,.16); color: var(--white); }

.miolo { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.ajuste { overflow: hidden; }   /* o renderizador mede se o texto coube neste campo */

/* Capa (gancho): título centralizado (a grade do perfil recorta a capa em 3:4) */
.capa .miolo { align-items: center; text-align: center; }
.capa h1 { font-size: 84px; line-height: 1.08; font-weight: 800; letter-spacing: -.02em; max-height: 560px; }
.capa .apoio { font-size: 36px; line-height: 1.35; font-weight: 500; margin-top: 36px; max-width: 820px; opacity: .95;
  max-height: 260px; }
.destaque { display: flex; align-items: center; justify-content: center; gap: 18px; font-weight: 800;
  letter-spacing: -.02em; line-height: 1; }
.destaque .par { font-weight: 300; color: var(--red); }
.vermelho .destaque .par { color: var(--white); opacity: .55; }
.capa .destaque { font-size: 120px; margin-bottom: 40px; }
.capa .destaque .par { font-size: 150px; }

/* Corpo: um ponto central por slide */
.indice { font-size: 30px; font-weight: 700; color: var(--red); letter-spacing: .06em; margin-bottom: 22px; }
.corpo h2 { font-size: 64px; line-height: 1.1; font-weight: 800; letter-spacing: -.015em; max-height: 290px; }
.corpo .texto { font-size: 40px; line-height: 1.4; font-weight: 500; color: var(--ink-soft); margin-top: 34px;
  max-height: 520px; }
.corpo .destaque { justify-content: flex-start; font-size: 136px; color: var(--ink); margin: 6px 0 30px; }
.corpo .destaque .par { font-size: 160px; }

/* Conclusão */
.conclusao h2 { font-size: 70px; line-height: 1.1; font-weight: 800; letter-spacing: -.015em; max-height: 330px; }
.conclusao .texto { font-size: 40px; line-height: 1.4; font-weight: 500; margin-top: 34px; max-height: 480px; }

.rodape { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; min-height: 56px; }
.fonte { font-size: 22px; line-height: 1.35; opacity: .85; max-width: 720px; max-height: 92px; }
.seguir { font-size: 26px; font-weight: 700; letter-spacing: .04em; display: flex; align-items: center; gap: 14px; }
.seguir::after { content: ""; width: 18px; height: 18px; border-top: 4px solid currentColor;
  border-right: 4px solid currentColor; transform: rotate(45deg); }
</style>
</head>
<body>
<div class="slide $tipo $fundo">
  $linhas
  <div class="topo"><img src="$logo" alt="Suno Asset"><span class="pagina">$pagina</span></div>
  <span class="rotulo">$rotulo</span>
  <div class="miolo">$miolo</div>
  <div class="rodape"><div class="fonte ajuste">$fonte</div>$seguir</div>
</div>
</body>
</html>
